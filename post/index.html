<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The sweet spot blog posts with easy to follow instructions and cleary described ingredients list. Share recipe with the link at the bottom of the page"
    />
    <title>Recipe | The Sweet Spot</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/post.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/0c657a5b56.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="site-content">
      <header>
        <div class="header-logo">
          <a
            class="logo-link-header"
            href="../index.html"
            aria-label="SweetSpot home"
          >
            <img
              class="footer-logo-header"
              src="../images/sweet_spot_logo_big_no_background.png"
              alt="The Sweet Spot"
            />
          </a>
        </div>
        <span id="greet-user"></span>
        <button class="hamburger-menu" id="hamburger-toggle">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
        <nav id="site-nav" class="navigation">
          <button class="close-menu-button" id="close-button">X</button>
          <ul class="nav-menu">
            <li class="home-nav"><a href="../index.html">Home</a></li>
            <li class="login-nav" id="login-navigation">
              <a href="../account/login.html">Log in</a>
            </li>
            <li class="logout-nav" id="logout-navigation">
              <a href="#">Log out</a>
            </li>
            <li class="create-user-nav" id="create-user-navigation">
              <a href="../account/register.html">Create user</a>
            </li>
            <li class="create-post-nav" id="create-post-navigation">
              <a href="../post/create.html">Create blog post</a>
            </li>
          </ul>
        </nav>
      </header>
      <main>
        <div id="blog-post-container" class="post-container">
          <div class="blogpost-img-container">
            <img id="post-image" src="" alt="" />
          </div>
          <div class="recipe-heading">
            <h1 id="post-title"></h1>
            <i class="fa-solid fa-heart"></i>
          </div>
          <div class="date-and-author">
            <p class="date-created" id="post-date"></p>
            <p class="author" id="post-author"></p>
          </div>
          <div class="ingredients-paragraph" id="post-ingredients"></div>
          <div class="instructions-paragraph" id="post-instructions"></div>
          <div class="edit-button-container">
            <button class="primary-button hidden" id="edit-button" href="#">
              Edit post
            </button>
          </div>
          <p id="link-copied-message" class="copy-hidden">
            Link copied to clipboard!
          </p>
          <button class="share-recipe-link" id="recipe-link">
            <p>Share this recipe with your friends and family</p>
            <i class="fa-solid fa-share-nodes"></i>
          </button>
        </div>
      </main>
      <footer>
        <div class="social-media">
          <h3>FIND US</h3>
          <div class="social-media-icons">
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-tiktok"></i>
            <i class="fa-brands fa-facebook"></i>
          </div>
        </div>
        <div class="line-divider-mobile"></div>
        <div class="footer-logo">
          <a
            class="logo-link-footer"
            href="../index.html"
            aria-label="SweetSpot home"
          >
            <img
              class="footer-logo-img"
              src="../images/sweet_spot_logo_big_no_background.png"
              alt="The Sweet Spot"
            />
          </a>
        </div>
        <div class="line-divider-1"></div>
        <div class="tagline">
          <p>Delicous sweet treats that just hits the spot</p>
          <i class="fa-solid fa-heart"></i>
        </div>
        <div class="line-divider-2"></div>
      </footer>
    </div>
    <script type="module" src="../js/post.js"></script>
    <script type="module" src="../js/nav.js"></script>
  </body>
</html>
