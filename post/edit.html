<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Edit your blog post here. You can either update or delete your blog posts."
    />
    <title>Edit Post | The Sweet Spot</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../images/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/form.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/0c657a5b56.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="site-content">
      <header>
        <div class="header-logo">
          <a
            class="logo-link-header"
            href="../index.html"
            aria-label="SweetSpot home"
          >
            <img
              class="footer-logo-header"
              src="../images/sweet_spot_logo_big_no_background.png"
              alt="The Sweet Spot"
            />
          </a>
        </div>
        <span id="greet-user"></span>
        <button class="hamburger-menu" id="hamburger-toggle">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
        <nav id="site-nav" class="navigation">
          <button class="close-menu-button" id="close-button">X</button>
          <ul class="nav-menu">
            <li class="home-nav"><a href="../index.html">Home</a></li>
            <li class="login-nav" id="login-navigation">
              <a href="../account/login.html">Log in</a>
            </li>
            <li class="logout-nav" id="logout-navigation">
              <a href="#">Log out</a>
            </li>
            <li class="create-user-nav" id="create-user-navigation">
              <a href="../account/register.html">Create user</a>
            </li>
            <li class="create-post-nav" id="create-post-navigation">
              <a href="../post/create.html">Create blog post</a>
            </li>
          </ul>
        </nav>
      </header>
      <main>
        <h1>Edit blog-post</h1>
        <form id="edit-form" class="blog-post-form">
          <div class="form-field">
            <label for="imageURL">Image</label>
            <input
              type="url"
              id="edit-imageURL"
              name="imageURL"
              placeholder="Paste image URL"
            />
          </div>
          <div class="form-field">
            <label for="title">Title</label>
            <input
              type="text"
              id="edit-title"
              name="title"
              placeholder="Title of your post"
              required
            />
          </div>
          <div class="form-field">
            <label for="ingredients">Ingredients</label>
            <textarea
              id="edit-ingredients"
              name="ingredients"
              placeholder="Ingredients list"
              rows="10"
              required
            >
            </textarea>
          </div>
          <div class="form-field">
            <label for="instructions">Instructions</label>
            <textarea
              id="edit-instructions"
              name="instructions"
              placeholder="Recipe instructions"
              rows="10"
              required
            ></textarea>
          </div>
          <p id="edit-message-display"></p>
          <div class="form-actions">
            <button
              type="submit"
              class="primary-button submit"
              id="update-button"
            >
              Update post
            </button>
            <button type="button" id="delete-button">Delete post</button>
          </div>
        </form>
      </main>
      <footer>
        <div class="social-media">
          <h3>FIND US</h3>
          <div class="social-media-icons">
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-tiktok"></i>
            <i class="fa-brands fa-facebook"></i>
          </div>
        </div>
        <div class="line-divider-mobile"></div>
        <div class="footer-logo">
          <a
            class="logo-link-footer"
            href="../index.html"
            aria-label="SweetSpot home"
          >
            <img
              class="footer-logo-img"
              src="../images/sweet_spot_logo_big_no_background.png"
              alt="The Sweet Spot"
            />
          </a>
        </div>
        <div class="line-divider-1"></div>
        <div class="tagline">
          <p>Delicous sweet treats that just hits the spot</p>
          <i class="fa-solid fa-heart"></i>
        </div>
        <div class="line-divider-2"></div>
      </footer>
    </div>
    <script type="module" src="../js/edit.js"></script>
    <script type="module" src="../js/nav.js"></script>
  </body>
</html>
