<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Log in to the sweet spot with your username and password to create new dessert blog posts for your blog"
    />
    <title>Login | The Sweet Spot</title>
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="../images/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="../images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/auth.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <script
      src="https://kit.fontawesome.com/0c657a5b56.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <div class="site-content">
      <header>
        <div class="header-logo">
          <a
            class="logo-link-header"
            href="../index.html"
            aria-label="SweetSpot home"
          >
            <img
              class="footer-logo-header"
              src="../images/sweet_spot_logo_big_no_background.png"
              alt="The Sweet Spot"
            />
          </a>
        </div>
        <button class="hamburger-menu" id="hamburger-toggle">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
        <nav id="site-nav" class="navigation">
          <button class="close-menu-button" id="close-button">X</button>
          <ul class="nav-menu">
            <li class="home-nav"><a href="../index.html">Home</a></li>
            <li class="login-nav" id="login-navigation">
              <a href="../account/login.html">Log in</a>
            </li>
            <li class="logout-nav" id="logout-navigation">
              <a href="#">Log out</a>
            </li>
            <li class="create-user-nav" id="create-user-navigation">
              <a href="../account/register.html">Create user</a>
            </li>
            <li class="create-post-nav" id="create-post-navigation">
              <a href="../post/create.html">Create blog post</a>
            </li>
          </ul>
        </nav>
      </header>
      <main class="auth">
        <section class="auth-card">
          <h1>Log in</h1>
          <form class="auth-form" id="login-form">
            <div class="email-field">
              <label for="email">Email</label>
              <div class="field-control">
                <i class="fa-regular fa-envelope field-icon"></i>
                <input
                  type="email"
                  id="email"
                  name="email"
                  placeholder="Type your email"
                  required
                />
              </div>
            </div>
            <div class="password-field">
              <label for="password">Password</label>
              <div class="field-control">
                <i class="fa-solid fa-lock field-icon"></i>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Type your password"
                  required
                />
              </div>
            </div>
            <p id="login-error"></p>
            <button class="primary-button">Log in</button>
          </form>
          <p class="auth-switch">
            Are you new here?
            <a href="../account/register.html">Create account</a>
          </p>
        </section>
      </main>
      <footer>
        <div class="social-media">
          <h3>FIND US</h3>
          <div class="social-media-icons">
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-tiktok"></i>
            <i class="fa-brands fa-facebook"></i>
          </div>
        </div>
        <div class="line-divider-mobile"></div>
        <div class="footer-logo">
          <a
            class="logo-link-footer"
            href="../index.html"
            aria-label="SweetSpot home"
          >
            <img
              class="footer-logo-img"
              src="../images/sweet_spot_logo_big_no_background.png"
              alt="The Sweet Spot"
            />
          </a>
        </div>
        <div class="line-divider-1"></div>
        <div class="tagline">
          <p>Delicous sweet treats that just hits the spot</p>
          <i class="fa-solid fa-heart"></i>
        </div>
        <div class="line-divider-2"></div>
      </footer>
    </div>
    <script type="module" src="../js/login.js"></script>
    <script type="module" src="../js/nav.js"></script>
  </body>
</html>
